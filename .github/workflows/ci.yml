name: Distribution contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test distribution and orchestration without network or credentials
        shell: pwsh
        run: |
          ./scripts/Test-DistributionContracts.ps1
          ./scripts/Test-Orchestration.ps1
